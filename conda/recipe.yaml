# Recipe for the conda package act-utilities, built with rattler-build:
#
#   rattler-build build --recipe conda/recipe.yaml --channel conda-forge
#
# The source is the directory or archive in the environment variable
# ACT_UTILITIES_SOURCE, by default this repository. The package alexandria of
# ACT depends on this package.

context:
  version: "1.95b"

package:
  name: act-utilities
  version: ${{ version }}

source:
  path: ${{ env.get("ACT_UTILITIES_SOURCE", default="..") }}

build:
  number: 0
  noarch: python
  script:
    - cmake -S . -B build -DCMAKE_INSTALL_PREFIX=$PREFIX -DBUILD_TESTING=OFF
    - cmake --install build

requirements:
  build:
    - cmake >=3.24
    - make
  host:
    - python >=3.10
  run:
    - python >=3.10
    - numpy
    - matplotlib-base
    - rdkit
    - pyyaml
    - xmltodict

tests:
  - python:
      imports:
        - actutils
        - molprops
        - mol_json
        - act_legacy
      pip_check: false
  - script:
      - coords2molprop -h
      - test -f $PREFIX/bin/gauss2molprop
      - test -f $PREFIX/share/act/atom_bond.xml
      - test -f $PREFIX/share/act/vsite4_amine.json
      - python -c "import actutils; assert actutils.actdata().endswith('share/act')"
      # The name act is that of the Python package of ACT
      - python -c "import importlib.util as u; assert u.find_spec('act') is None"

about:
  homepage: https://github.com/AlexandriaChemistry/ACT-utilities
  repository: https://github.com/AlexandriaChemistry/ACT-utilities
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Python modules and scripts of the Alexandria Chemistry Toolkit (ACT)

extra:
  recipe-maintainers:
    - dspoel
    - JulianKoengeter
    - MansRosenbaum
