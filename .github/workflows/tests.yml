name: ACT-utilities tests
run-name: ${{ github.actor }} tests ACT-utilities
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest and a recent Python that the conda package supports
        python-version: ["3.10", "3.13"]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Check out ACT-utilities
        uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          channels: conda-forge
          conda-remove-defaults: "true"
          python-version: ${{ matrix.python-version }}
      - name: Install the dependencies
        shell: bash -el {0}
        run: |
          conda install cmake make numpy matplotlib-base rdkit pyyaml xmltodict
          conda list
      - name: Install ACT-utilities
        shell: bash -el {0}
        run: |
          cmake -S . -B build -DCMAKE_INSTALL_PREFIX=${RUNNER_TEMP}/act-utilities
          cmake --build build
          cmake --install build
      - name: Check the installed modules and scripts
        shell: bash -el {0}
        run: |
          prefix=${RUNNER_TEMP}/act-utilities
          pyver=$(python -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          PYTHONPATH=${prefix}/lib/python${pyver}/site-packages/act_utilities \
              python -c "import actutils, molprops, mol_json, molutils, elements, act_legacy"
          # The directory site-packages/act is that of the package act of ACT
          test ! -e ${prefix}/lib/python${pyver}/site-packages/act
          test ! -e ${prefix}/lib/python${pyver}/site-packages/act.pth
          ${prefix}/bin/coords2molprop -h > /dev/null
          test -f ${prefix}/share/act/atom_bond.xml
          test -f ${prefix}/share/act/atomtypes_gui.csv
          # The installed modules find the installed data files
          PYTHONPATH=${prefix}/lib/python${pyver}/site-packages/act_utilities \
              python -c "import actutils; d = actutils.actdata(); print(d); assert d.startswith('${prefix}')"
      - name: Run the tests
        shell: bash -el {0}
        run: |
          set -o pipefail
          cd build
          ctest --output-on-failure | tee ctest.log
          # The tests of coords2molprop must run, not be skipped. The tests
          # of the OpenMM interface are skipped, since they need alexandria
          # and OpenMM; the CI of ACT runs them.
          cd ../src/tests
          python -m unittest -v test_coords2molprop 2>&1 | tee coords2molprop.log
          if grep -q "skipped" coords2molprop.log; then
            echo "::error::The tests of coords2molprop were skipped"
            exit 1
          fi
