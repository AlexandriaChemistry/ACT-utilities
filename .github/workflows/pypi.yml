name: PyPI package
run-name: ${{ github.actor }} builds the PyPI package act-utilities
# Builds the sdist and wheel of act-utilities and publishes them on PyPI.
# Pull requests that change the package only build and test them. A tag v*
# publishes them; a run by hand publishes the release whose tag is given.
# Publishing uses PyPI trusted publishing, without a token: the project on
# pypi.org must have this repository, the workflow pypi.yml and the
# environment pypi as a trusted publisher.
on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "src/**"
      - "share/**"
      - "CMakeLists.txt"
      - "pyproject.toml"
      - "hatch_build.py"
      - "README.md"
      - "LICENSE"
      - ".github/workflows/pypi.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release to publish, e.g. v1.95b"
        type: string
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The tag to build: the pushed tag, the one given by hand, or none
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check the version
        run: |
          project=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          recipe=$(sed -n 's/^  version: "\(.*\)"$/\1/p' conda/recipe.yaml)
          echo "pyproject.toml ${project}, conda/recipe.yaml ${recipe}, tag ${TAG:-none}"
          if [ "${project}" != "${recipe}" ]; then
            echo "::error::pyproject.toml has version ${project}, conda/recipe.yaml ${recipe}"
            exit 1
          fi
          if [ -n "${TAG}" ] && [ "${TAG}" != "v${project}" ]; then
            echo "::error::Tag ${TAG} does not match version ${project}"
            exit 1
          fi
      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
          ls -l dist
      - name: Test the wheel
        env:
          MPLBACKEND: Agg
        run: |
          python -m venv "${RUNNER_TEMP}/venv"
          venv="${RUNNER_TEMP}/venv"
          "${venv}/bin/pip" install dist/*.whl
          cd "${RUNNER_TEMP}"
          "${venv}/bin/python" -c "import actutils, molprops, mol_json, molutils, elements, act_legacy, mol_csv_api"
          # The modules find the data files in share/act of the environment
          "${venv}/bin/python" -c "import actutils; d = actutils.actdata(); print(d); assert d == '${venv}/share/act'"
          # The name act is that of the Python package of ACT
          "${venv}/bin/python" -c "import importlib.util as u; assert u.find_spec('act') is None"
          # The scripts with the option -h; annealing_plot.py has none
          for script in coords2molprop gauss2molprop generate_mp molselect reshuffle_selection \
                        donchev2molprop ncia2molprop dimer_scan plot_convergence view_fitness \
                        energy_distributions replace_interactions calc_tip4p_dummy.py; do
            "${venv}/bin/${script}" -h > /dev/null
          done
          ! grep -rl "@ACT_" "${venv}/bin" "${venv}"/lib/python*/site-packages/act_utilities
      - name: Compare with the installation by CMake
        run: |
          cmake -S . -B build -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/cmake" -DBUILD_TESTING=OFF
          cmake --install build
          # The files of each installation, with site-packages without the
          # version of Python, and without what pip adds
          list() {
            (cd "$1" && find share/act lib bin -type f \
               | sed 's#lib/python[0-9.]*/site-packages#site-packages#' \
               | grep -E '^(share/act/|site-packages/act_utilities|bin/)' \
               | grep -v __pycache__ | sort)
          }
          list "${RUNNER_TEMP}/cmake" > cmake.txt
          wheel=$(python -c "import zipfile, glob; print('\n'.join(zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist()))")
          echo "${wheel}" | grep -v '\.dist-info/' | sed -n -e 's#^act_utilities-[^/]*\.data/data/##p' \
                                  -e 's#^act_utilities-[^/]*\.data/scripts/#bin/#p' \
                                  -e 's#^\(act_utilities.*\)#site-packages/\1#p' | sort > wheel.txt
          diff cmake.txt wheel.txt
      - name: Keep the files
        uses: actions/upload-artifact@v7
        with:
          name: pypi-dist
          path: dist/

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/act-utilities/
    permissions:
      # For trusted publishing
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pypi-dist
          path: dist/
      - name: Publish on PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
